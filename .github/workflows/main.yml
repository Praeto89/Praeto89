# GitHub Actions Workflow for Snake Animation
# Generates a snake eating your contribution graph with pastel colors
# Inspired by PresentationTemplate color palette

name: Generate Snake Animation

# Controls when the workflow will run
on:
  # Runs on a schedule (daily at 05:00 UTC)
  schedule:
    - cron: "0 5 * * *"
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Runs on every push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    concurrency:
      group: snake-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    # Required permissions for the workflow
    permissions:
      contents: write
    
    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Generate the snake animation (includes private repos via token)
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Praeto89
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake.svg?palette=github-dark
      
      # Commit snake.svg directly to main
      - name: Commit snake.svg to main
        run: |
          cp dist/snake.svg assets/snake.svg
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --quiet -- assets/snake.svg; then
            echo "No changes to snake.svg"
          else
            git add assets/snake.svg
            git commit -m "chore: update snake animation"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
