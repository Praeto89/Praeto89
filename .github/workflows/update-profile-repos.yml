name: Update Profile Repos

on:
  schedule:
    - cron: "45 4 * * *"  # daily 04:45 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-profile-repos-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate repo list section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api /users/Praeto89/repos --paginate --jq '.[] | select(.archived == false) | {name, html_url, description, pushed_at}' > repos.ndjson
          jq -s 'sort_by(.pushed_at) | reverse | .[0:12]' repos.ndjson > repos.json

          custom=$(cat assets/repo-descriptions.json 2>/dev/null || echo '{}')
          {
            echo "<!-- REPO-LIST:START -->"
            jq -r --argjson custom "$custom" '.[] | "- [" + .name + "](" + .html_url + ") - " + ((.description // $custom[.name] // "No description") | gsub("\\n"; " ")) + " _(updated " + ((.pushed_at | split("T")[0])) + ")_"' repos.json
            echo "<!-- REPO-LIST:END -->"
          } > repos_section.md

          cat > update_section.py <<'PY'
          import sys, re
          from pathlib import Path

          readme = Path('README.md')
          section = Path(sys.argv[1]).read_text()
          marker = sys.argv[2]
          pattern = rf"<!-- {marker}:START -->.*?<!-- {marker}:END -->"
          text = readme.read_text()
          if re.search(pattern, text, flags=re.S):
            text = re.sub(pattern, section, text, flags=re.S)
          else:
            text = text.rstrip() + "\n\n" + section + "\n"
          readme.write_text(text)
          PY

          python update_section.py repos_section.md REPO-LIST

      - name: Generate language stats bar chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api /users/Praeto89/repos --paginate --jq '.[].full_name' > repo_names.txt

          # Fetch languages per repo and aggregate byte counts
          while IFS= read -r repo; do
            gh api "/repos/$repo/languages" 2>/dev/null || echo '{}'
          done < repo_names.txt | jq -s 'add // {} | to_entries | sort_by(-.value)' > lang_data.json

          total=$(jq '[.[].value] | add // 1' lang_data.json)

          # Render the bar chart SVG from the live language data (single source of truth)
          jq -r --argjson total "$total" '
            def col($k): {
              "Python":"#3776ab","TypeScript":"#3178c6","JavaScript":"#f1e05a",
              "GDScript":"#478cbf","HTML":"#e34c26","CSS":"#563d7c","Kotlin":"#A97BFF",
              "PowerShell":"#012456","Shell":"#89e051","C#":"#178600","Java":"#b07219",
              "C++":"#f34b7d","Go":"#00ADD8","Ruby":"#701516","Rust":"#dea584"
            }[$k] // "#8b8ba0";
            ([ .[] | {name: .key, pct: (.value * 100 / $total | round)} | select(.pct >= 1) ] | .[0:6]) as $langs
            | ($langs | length) as $n
            | (12 + $n * 42) as $h
            | (["<svg width=\"500\" height=\"\($h)\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 \($h)\">"]
               + ([ $langs | to_entries[]
                    | (.key * 42) as $off
                    | (20 + $off) as $ty
                    | (26 + $off) as $by
                    | (.value.pct * 4.5 | round) as $bw
                    | "  <text x=\"0\" y=\"\($ty)\" font-family=\"'"'"'Segoe UI'"'"', Arial, sans-serif\" font-size=\"13\" fill=\"#c5c9d0\" font-weight=\"600\">\(.value.name)</text>\n  <text x=\"490\" y=\"\($ty)\" font-family=\"'"'"'Segoe UI'"'"', Arial, sans-serif\" font-size=\"13\" fill=\"#a29bfe\" text-anchor=\"end\">\(.value.pct)%</text>\n  <rect x=\"0\" y=\"\($by)\" width=\"450\" height=\"10\" rx=\"5\" fill=\"#1a1a3e\"/>\n  <rect x=\"0\" y=\"\($by)\" width=\"\($bw)\" height=\"10\" rx=\"5\" fill=\"\(col(.value.name))\"/>"
                  ])
               + ["</svg>"])
            | join("\n")
          ' lang_data.json > assets/lang-bars.svg

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md assets/lang-bars.svg; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add README.md assets/lang-bars.svg
          git commit -m "chore: update profile sections"
          git push
