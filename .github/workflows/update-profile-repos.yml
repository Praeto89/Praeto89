name: Update Profile Repos

on:
  schedule:
    - cron: "45 4 * * *"  # daily 04:45 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-profile-repos-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate repo list section
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_REPOS || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api /users/Praeto89/repos --paginate --jq '.[] | select(.archived == false) | {name, html_url, description, pushed_at}' > repos.ndjson
          jq -s 'sort_by(.pushed_at) | reverse | .[0:12]' repos.ndjson > repos.json

          custom=$(cat assets/repo-descriptions.json 2>/dev/null || echo '{}')
          {
            echo "<!-- REPO-LIST:START -->"
            jq -r --argjson custom "$custom" '.[] | "- [" + .name + "](" + .html_url + ") - " + ((.description // $custom[.name] // "No description") | gsub("\\n"; " ")) + " _(updated " + ((.pushed_at // "") | sub("T.*"; "")) + ")_"' repos.json
            echo "<!-- REPO-LIST:END -->"
          } > repos_section.md

          cat > update_section.py <<'PY'
          import sys, re
          from pathlib import Path

          readme = Path('README.md')
          section = Path(sys.argv[1]).read_text()
          marker = sys.argv[2]
          pattern = rf"<!-- {marker}:START -->.*?<!-- {marker}:END -->"
          text = readme.read_text()
          if re.search(pattern, text, flags=re.S):
            text = re.sub(pattern, section, text, flags=re.S)
          else:
            text = text.rstrip() + "\n\n" + section + "\n"
          readme.write_text(text)
          PY

          python update_section.py repos_section.md REPO-LIST

      - name: Generate language stats section
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_REPOS || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api /users/Praeto89/repos --paginate --jq '.[].full_name' > repo_names.txt

          # Fetch languages per repo and aggregate
          while IFS= read -r repo; do
            gh api "/repos/$repo/languages" 2>/dev/null || echo '{}'
          done < repo_names.txt | jq -s 'add // {} | to_entries | sort_by(-.value)' > lang_data.json

          total=$(jq '[.[].value] | add // 1' lang_data.json)

          {
            echo "<!-- LANG-STATS:START -->"
            jq -r --argjson total "$total" '.[:6][] | (.value * 100 / $total | round) as $pct | select($pct >= 1) | "- **" + .key + ":** " + ($pct | tostring) + "%"' lang_data.json
            echo "<!-- LANG-STATS:END -->"
          } > lang_section.md

          python update_section.py lang_section.md LANG-STATS

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add README.md
          git commit -m "chore: update profile sections"
          git push
