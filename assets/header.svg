<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="33%" stop-color="#54a0ff"/>
      <stop offset="66%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#fd79a8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Top accent stripe -->
  <rect width="1200" height="4" fill="url(#accent)"/>

  <!-- Bottom accent stripe -->
  <rect y="296" width="1200" height="4" fill="url(#accent)"/>

  <!-- Decorative circles — top left -->
  <circle cx="72" cy="72" r="58" fill="none" stroke="#54a0ff" stroke-width="1" opacity="0.18"/>
  <circle cx="72" cy="72" r="38" fill="none" stroke="#54a0ff" stroke-width="1" opacity="0.22"/>
  <circle cx="72" cy="72" r="18" fill="#54a0ff" opacity="0.06"/>
  <circle cx="72" cy="72" r="4" fill="#00d2d3" opacity="0.7"/>

  <!-- Decorative circles — bottom right -->
  <circle cx="1132" cy="234" r="68" fill="none" stroke="#a29bfe" stroke-width="1" opacity="0.16"/>
  <circle cx="1132" cy="234" r="44" fill="none" stroke="#fd79a8" stroke-width="1" opacity="0.18"/>
  <circle cx="1132" cy="234" r="20" fill="#fd79a8" opacity="0.04"/>
  <circle cx="1132" cy="234" r="4" fill="#fd79a8" opacity="0.6"/>

  <!-- Accent circles — top right -->
  <circle cx="1060" cy="52" r="28" fill="none" stroke="#00d2d3" stroke-width="0.8" opacity="0.22"/>
  <circle cx="1060" cy="52" r="2.5" fill="#00d2d3" opacity="0.5"/>

  <!-- Accent circle — bottom left -->
  <circle cx="148" cy="258" r="24" fill="none" stroke="#a29bfe" stroke-width="0.8" opacity="0.22"/>
  <circle cx="148" cy="258" r="2.5" fill="#a29bfe" opacity="0.5"/>

  <!-- Grid dots — top center-left -->
  <circle cx="170" cy="28" r="1.3" fill="#54a0ff" opacity="0.18"/>
  <circle cx="196" cy="28" r="1.3" fill="#54a0ff" opacity="0.18"/>
  <circle cx="222" cy="28" r="1.3" fill="#54a0ff" opacity="0.18"/>
  <circle cx="248" cy="28" r="1.3" fill="#54a0ff" opacity="0.18"/>
  <circle cx="274" cy="28" r="1.3" fill="#54a0ff" opacity="0.18"/>
  <circle cx="300" cy="28" r="1.3" fill="#54a0ff" opacity="0.18"/>
  <circle cx="170" cy="54" r="1.3" fill="#54a0ff" opacity="0.12"/>
  <circle cx="196" cy="54" r="1.3" fill="#54a0ff" opacity="0.12"/>
  <circle cx="222" cy="54" r="1.3" fill="#54a0ff" opacity="0.12"/>
  <circle cx="248" cy="54" r="1.3" fill="#54a0ff" opacity="0.12"/>
  <circle cx="274" cy="54" r="1.3" fill="#54a0ff" opacity="0.12"/>

  <!-- Grid dots — bottom center-right -->
  <circle cx="900" cy="248" r="1.3" fill="#a29bfe" opacity="0.18"/>
  <circle cx="926" cy="248" r="1.3" fill="#a29bfe" opacity="0.18"/>
  <circle cx="952" cy="248" r="1.3" fill="#a29bfe" opacity="0.18"/>
  <circle cx="978" cy="248" r="1.3" fill="#a29bfe" opacity="0.18"/>
  <circle cx="1004" cy="248" r="1.3" fill="#a29bfe" opacity="0.18"/>
  <circle cx="900" cy="272" r="1.3" fill="#a29bfe" opacity="0.12"/>
  <circle cx="926" cy="272" r="1.3" fill="#a29bfe" opacity="0.12"/>
  <circle cx="952" cy="272" r="1.3" fill="#a29bfe" opacity="0.12"/>
  <circle cx="978" cy="272" r="1.3" fill="#a29bfe" opacity="0.12"/>

  <!-- Horizontal decorative lines -->
  <line x1="24" y1="150" x2="340" y2="150" stroke="#54a0ff" stroke-width="0.6" opacity="0.22"/>
  <line x1="860" y1="150" x2="1176" y2="150" stroke="#a29bfe" stroke-width="0.6" opacity="0.22"/>

  <!-- Small left-side tick marks on center line -->
  <line x1="24" y1="145" x2="24" y2="155" stroke="#00d2d3" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="147" x2="60" y2="153" stroke="#54a0ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Small right-side tick marks on center line -->
  <line x1="1176" y1="145" x2="1176" y2="155" stroke="#fd79a8" stroke-width="1" opacity="0.4"/>
  <line x1="1140" y1="147" x2="1140" y2="153" stroke="#a29bfe" stroke-width="0.8" opacity="0.3"/>

  <!-- Main name text with glow -->
  <text x="600" y="142"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="68"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="3"
    filter="url(#glow)">
    Martin St
  </text>

  <!-- Subtitle text -->
  <text x="600" y="190"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    fill="#a29bfe"
    text-anchor="middle"
    letter-spacing="4"
    opacity="0.95">
    Pedagogy  ×  Godot  ×  Game-Based Learning
  </text>

  <!-- Decorative line below subtitle -->
  <line x1="380" y1="218" x2="820" y2="218" stroke="url(#accent)" stroke-width="1.5" opacity="0.65"/>
</svg>
