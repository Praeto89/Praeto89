<svg width="1200" height="40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d2d3" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#00d2d3" stop-opacity="0.7"/>
      <stop offset="35%"  stop-color="#54a0ff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#a29bfe" stop-opacity="1"/>
      <stop offset="65%"  stop-color="#54a0ff" stop-opacity="0.9"/>
      <stop offset="85%"  stop-color="#fd79a8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fd79a8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Gradient divider line -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#line-grad)" stroke-width="2"/>
  <!-- Center diamond accent -->
  <rect x="596" y="16" width="8" height="8" rx="1" ry="1"
    fill="#a29bfe" opacity="0.8" transform="rotate(45 600 20)"/>
</svg>
